services:
  postgres:
    image: postgres:15-alpine
    container_name: api-mirror-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - api-mirror-postgres:/var/lib/postgresql/data
    networks:
      - api-mirror-network

networks:
  api-mirror-network:
    external: true

volumes:
  api-mirror-postgres:
